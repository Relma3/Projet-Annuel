services:

  web:
    build:
      context: .
      target: dev
    container_name: silverhappy_web_dev
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - storage_factures:/var/www/html/storage/factures
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - silverhappy_net
    restart: unless-stopped

  go-api:
    build:
      context: ./go-api
      target: builder
    container_name: silverhappy_goapi_dev
    command: go run main.go
    ports:
      - "8080:8080"
    volumes:
      - ./go-api:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - silverhappy_net
    restart: unless-stopped

  db:
    image: mariadb:10.11
    container_name: silverhappy_db_dev
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    ports:
      - "3306:3306"
    volumes:
      - db_data_dev:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/schema_additions.sql:/docker-entrypoint-initdb.d/02-schema_additions.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - silverhappy_net
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: silverhappy_pma_dev
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASS}
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - silverhappy_net
    restart: unless-stopped

  dockge:
    image: louislam/dockge:1
    container_name: silverhappy_dockge
    ports:
      - "5001:5001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockge_data:/app/data
    networks:
      - silverhappy_net
    restart: unless-stopped

networks:
  silverhappy_net:
    driver: bridge

volumes:
  db_data_dev:
  storage_factures:
  dockge_data:
