<VirtualHost *:80>
    ServerName silverhappy.com
    ServerAlias www.silverhappy.com
    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName silverhappy.com
    ServerAlias www.silverhappy.com
    DocumentRoot /app
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/silverhappy.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/silverhappy.com/privkey.pem
    <Directory /app>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>